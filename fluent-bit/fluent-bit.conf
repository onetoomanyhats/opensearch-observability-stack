[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name         tail
    Path         /logs/app.log
    Parser       json
    Tag          app.logs
    Read_from_Head true

[FILTER]
    Name         modify
    Match        app.logs
    Add          environment demo
    Add          platform local-lab

[OUTPUT]
    Name              es
    Match             app.logs
    Host              opensearch
    Port              9200
    Index             app-logs
    Logstash_Format   On
    Suppress_Type_Name On
